server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/javascript application/wasm application/json text/css;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
