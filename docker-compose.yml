services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      blender-worker:
        condition: service_healthy

  blender-worker:
    build:
      context: .
      dockerfile: Dockerfile.blender
    restart: unless-stopped
    environment:
      PORT: "8787"
      BLENDER_CONCURRENCY: "1"
    volumes:
      - render-cache:/tmp/visual-scientific-cache
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  render-cache:
